[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "devenv-polyglot"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = []

# --- DEPENDENCY GROUPS (PEP 735) ---
[dependency-groups]
base = [
  # --- Core Pydantic Stack ---
  "pydantic>=2.10",
  "pydantic-settings>=2.7",
  "pydantic-extra-types>=2.9",
  "icontract>=2.6",
  "devtools>=0.12",
  "datamodel_code_generator",

  "logfire",
  "orjson",

  # --- Development Tools (Moved to Base) ---
  "ruff>=0.9.0",
  "ty>=0.0.12",


  # --- User Utilities ---
  "pytest",
  "restate-sdk",
  "invoke",
  "watchfiles",
  "pytest-cov",
  # "pytest-mock",
  "opendal",
  "plumbum",
  # "loguru",
  "polyfactory",
  # "hypothesis",
  "rich",
  "minijinja",
  "typer",
  "httpx",
  # "websockets",
  # "pathvalidate",
  # "pathspec",
  # "s3fs",
  "universal-pathlib",
  # "fsspec[s3,http]",
  # "icecream",
  # "uvloop",
  # "python-magic",
  # "aiofiles",
]

tui = ["textual"]

fastapi = [
  "fastapi",
  "atlas-provider-sqlalchemy",
  "psycopg[binary]",
  "datamodel-code-generator",
  "sqlmodel",
  # minijinja replaced "jinja2-fragments", "fastapi-htmx","fasthx[jinja]",
  "granian[pname,uvloop,reload]",
  # "asyncpg",
  "connect-python",
  # "libsql",
  # "supabase",
  "slowapi",
  "cashews",
  "fastapi-pagination",
  "pytailwindcss",
]

marimo = [
  "marimo",
  "ibis-framework[duckdb]",
  "openai",
  "python-lsp-server",
  # "d2-widget",
  # "pygwalker",
  # "polars",
  # "numpy",
  "dlt",
  "altair",
  "vegafusion",
  "vl-convert-python",
  "pandera[ibis]",
  # "bambi",
  "joblib",
]

dagster = [
  "dagster",
  "data-diff",

  "dagster-duckdb",
  # "whylogs",
  # "apache-gravitino",
  "dagster-postgres",
  "dagster-polars",
  # "sqlmesh[duckdb,github]",
  # "dagster-sqlmesh",
  "dagster-dlt",
  "dagster-ducklake",
  "dagster-iceberg",
  "dagster-ibis",
  "dagster-pandera",
  "dagster-dg-cli",
  "dagster-webserver",
]

daft = ["daft[audio,google,iceberg,postgres,sql,viz]"]

adbc = [
  # "adbc-driver-postgresql",
  # "adbc-driver-duckdb",
  # "pyarrow"
]

cloud = ["pytest-kubernetes", "kr8s", "infisical-python"]

ocr = ["kreuzberg"]

# --- TOOL CONFIGURATION ---

[tool.dg]
directory_type = "project"
root_module = "pipeline"

[tool.hatch.build.targets.wheel]
packages = ["src"]

# --- TY CONFIGURATION ---
[tool.ty.environment]
# python-version = "3.11"

[tool.ty.rules]
possibly-unresolved-reference = "error"

[tool.ty.terminal]
error-on-warning = true
output-format = "full"

[tool.ty.analysis]
respect-type-ignore-comments = true

# --- RUFF CONFIGURATION ---
[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "N", "RUF", "TCH", "FURB"]
ignore = ["B008"]
fixable = ["ALL"]

[tool.ruff.lint.isort]
known-first-party = ["devenv_polyglot"]
