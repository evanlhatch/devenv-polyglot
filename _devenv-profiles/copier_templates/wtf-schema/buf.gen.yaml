version: v2
plugins:
  # 1. Unreal Engine C++ (via Local OCI)
  - local: ["devenv", "container", "wtf-schema", "run", "--"]
    out: Plugins/TurboLink/Source/TurboLinkGrpc
    strategy: all
  # 2. Python & Pydantic V2
  - remote: buf.build/community/neoeul-pydanticv2
    out: gen/python
    opt:
      - "target=pydantic_v2"
  # 3. Postgres SQL Schema
  - remote: buf.build/community/chrusty-protoc-gen-sql
    out: gen/postgres
